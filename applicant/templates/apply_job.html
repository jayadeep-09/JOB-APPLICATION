{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow p-4">

            <h2 class="text-center mb-4">
                Apply For Job
            </h2>

            <form>

                <div class="mb-3">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input type="text"
                           class="form-control"
                           placeholder="Enter full name">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Email Address
                    </label>

                    <input type="email"
                           class="form-control"
                           placeholder="Enter email">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Phone Number
                    </label>

                    <input type="text"
                           class="form-control"
                           placeholder="Enter phone number">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Skills
                    </label>

                    <input type="text"
                           class="form-control"
                           placeholder="Python, Django, SQL">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Experience
                    </label>

                    <input type="text"
                           class="form-control"
                           placeholder="Example: 2 Years">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Upload Resume
                    </label>

                    <input type="file"
                           class="form-control">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Cover Letter
                    </label>

                    <textarea class="form-control"
                              rows="5"
                              placeholder="Write your cover letter"></textarea>

                </div>

                <button type="submit"
                        class="btn btn-success w-100">

                    Submit Application

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
