{% extends 'base.html' %}

{% block content %}

<div class="form-container">

    <div class="glass-card">

        <h2 class="form-title">
            Login
        </h2>

        <form>

            <div class="form-group">

                <label>
                    Username
                </label>

                <input type="text"
                       placeholder="Enter username">

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input type="password"
                       placeholder="Enter password">

            </div>


            <button class="primary-btn"
                    type="submit">

                Login

            </button>

        </form>

        <p class="form-bottom-text">

            Don't have an account?

            <a href="/signup/">

                Signup

            </a>

        </p>

    </div>

</div>

{% endblock %}
