{% extends 'base.html' %}

{% block content %}

<div class="auth-wrapper">

    <div class="auth-container">

        <h1>Create Account</h1>

        <form method="POST">

            {% csrf_token %}

            <div class="input-box">
                <label>Username</label>
                <input type="text" name="username" class="form-input" placeholder="Enter username">
            </div>

            <div class="input-box">
                <label>Email</label>
                <input type="email" name="email" class="form-input" placeholder="Enter email">
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" name="password1" class="form-input" placeholder="Enter password">
            </div>

            <div class="input-box">
                <label>Confirm Password</label>
                <input type="password" name="password2" class="form-input" placeholder="Confirm password">
            </div>

            <button type="submit" class="signup-btn">
                Create Account
            </button>

        </form>

        <p class="bottom-text">
            Already have an account?
            <a href="/login/">Login</a>
        </p>

    </div>

</div>

{% endblock %}
