{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow p-4">

            <h2 class="text-center mb-4">
                Edit Profile
            </h2>

            <form>

                <div class="mb-3">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input type="text"
                           class="form-control"
                           value="John Doe">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input type="email"
                           class="form-control"
                           value="john@example.com">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Phone
                    </label>

                    <input type="text"
                           class="form-control"
                           value="9876543210">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Location
                    </label>

                    <input type="text"
                           class="form-control"
                           value="Hyderabad">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Bio
                    </label>

                    <textarea class="form-control"
                              rows="4">Passionate full stack developer.</textarea>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Upload Profile Image
                    </label>

                    <input type="file"
                           class="form-control">

                </div>

                <button type="submit"
                        class="btn btn-success w-100">

                    Save Changes

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
